.header-sub{font-family:'Raleway',sans-serif; font-size:16px; color:var(--stone); margin-top:10px; font-weight:300;}
.nav{position:sticky; top:0; z-index:50; background:var(--white); border-bottom:1px solid var(--stone-dark); box-shadow:0 2px 8px rgba(0,0,0,0.04);}
.nav-inner{max-width:1200px; margin:0 auto; display:flex; overflow-x:auto;}
.nav-btn{font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-light); background:none; border:none; padding:18px 20px; cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent; transition:all .15s;}
.nav-btn:hover{color:var(--ink);}
.nav-btn.active{color:var(--ink); border-bottom-color:var(--gold); font-weight:500;}
.container{max-width:1200px; margin:0 auto; padding:40px 32px 80px;}
.tab-content{display:none;}
.tab-content.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;} to{opacity:1;}}

.section-title:first-child{margin-top:0;}
.section-label{font-family:'DM Mono',monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin-bottom:8px;}
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:8px;}
.kpi-card{background:var(--white); border:1px solid var(--stone); border-radius:4px; padding:22px 20px; border-top:3px solid var(--gold);}
.kpi-value{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:32px; color:var(--ink);}
.kpi-label{font-family:'DM Mono',monospace; font-size:12px; color:var(--ink-light); text-transform:uppercase; letter-spacing:0.5px; margin-top:4px;}
.kpi-sublabel{font-size:13px; color:var(--ink-faint); margin-top:6px;}
.card{background:var(--white); border:1px solid var(--stone); border-radius:4px; padding:24px; margin-bottom:24px;}
.card-title{font-size:20px; font-weight:600; color:var(--ink); margin-bottom:16px; font-family:'Raleway',sans-serif;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
.grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px;}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.chart-wrap{position:relative; height:320px;}
.chart-wrap.tall{height:420px;}
.insight{background:var(--gold-pale); border-left:4px solid var(--gold); padding:16px 20px; border-radius:2px; font-size:15px; color:var(--ink-mid); margin:16px 0;}
.insight b{color:var(--ink);}
.sel-btn{font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.5px; padding:8px 16px; border:1px solid var(--stone-dark); background:var(--white); color:var(--ink-mid); cursor:pointer; border-radius:2px; margin:0 6px 6px 0;}
.sel-btn.active{background:var(--ink); color:var(--gold-light); border-color:var(--ink);}
.bar-row{display:flex; align-items:center; gap:12px; margin-bottom:10px; font-size:14px;}
.bar-row .label{width:200px; flex-shrink:0; color:var(--ink-mid);}
.bar-track{flex:1; background:var(--stone); border-radius:3px; height:20px; overflow:hidden; position:relative;}
.bar-fill{background:var(--gold); height:100%; border-radius:3px;}
.bar-fill.rose{background:var(--accent-rose);}
.bar-val{width:110px; flex-shrink:0; text-align:right; font-family:'DM Mono',monospace; font-size:13px; color:var(--ink-mid);}
table{width:100%; border-collapse:collapse; font-size:15px;}
th{font-family:'DM Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-light); text-align:left; padding:10px 8px; border-bottom:2px solid var(--stone-dark);}
td{padding:10px 8px; border-bottom:1px solid var(--stone);}
tr.hot td{color:var(--accent-rose); font-weight:600;}
.channel-card{background:var(--white); border:1px solid var(--stone); border-radius:4px; padding:16px 18px;}
.channel-card .name{font-weight:600; color:var(--ink); text-transform:capitalize; margin-bottom:6px;}
.channel-card .stats{font-family:'DM Mono',monospace; font-size:12px; color:var(--ink-light); margin-bottom:8px;}
.mini-progress{height:6px; background:var(--stone); border-radius:3px; overflow:hidden;}
.mini-progress .fill{height:100%; background:var(--gold);}
.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; font-size:13px;}
.legend-item{display:flex; align-items:center; gap:6px;}
.legend-dot{width:10px; height:10px; border-radius:2px;}
.drill-list{margin-top:16px;}
.pair-list .pair{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--stone); font-size:14px;}
.pair .count{font-family:'DM Mono',monospace; color:var(--gold); font-weight:600;}
</style>

<script>
const D = REPORT_DATA;
const fmt$ = n => '$' + Math.round(n).toLocaleString('en-US');
const fmt$2 = n => '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtN = n => Math.round(n).toLocaleString('en-US');
const fmtPct = n => n.toFixed(1) + '%';
const GOLD='#C9A84C', STONE='#E8E0D4', INK='#1A1510', ROSE='#C4846A', TEAL='#5A8A7A', SLATE='#6B7F8A', GOLDLIGHT='#E8D5A0';
const palette = [GOLD, TEAL, ROSE, SLATE, '#8A6B9A', '#B8945A', '#7A9A8A', STONE];

Chart.defaults.font.family = "'Raleway', sans-serif";
Chart.defaults.font.size = 13;
Chart.defaults.color = '#3D3328';

const charts = {};
function killChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

const TABS = [
  {id:'overview', label:'Overview'},
  {id:'customers', label:'Customers'},
  {id:'channels', label:'Channels'},
  {id:'products', label:'Products'},
  {id:'geography', label:'Geography'},
  {id:'timing', label:'Purchase Timing'},
  {id:'returns', label:'Returns'},
  {id:'survey', label:'Survey'},
];

document.getElementById('navInner').innerHTML = TABS.map((t,i)=>
  `<button class="nav-btn ${i===0?'active':''}" data-tab="${t.id}" onclick="showTab('${t.id}')">${t.label}</button>`).join('');

function showTab(id){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active', c.id===id));
  renderTab(id);
}

const rendered = new Set();

function renderTab(id){
  if(rendered.has(id)) return;
  rendered.add(id);
  RENDERERS[id]();
}

// ============ OVERVIEW ============
function renderOverview(){
  const el = document.getElementById('overview');

  el.innerHTML = `
    <div class="section-label">Tab 1</div>
    <div class="section-title">Overview</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-value">${fmt$(k.gross_sales)}</div><div class="kpi-label">Gross Sales</div></div>

      pointRadius: D.daily_trend.map(d=> D.promo_windows_declared ? (d.promo ? 6 : 2) : 3),
      pointBackgroundColor: D.daily_trend.map(d=> D.promo_windows_declared ? (d.promo ? GOLD : STONE) : GOLD),
      pointBorderColor: D.daily_trend.map(d=> D.promo_windows_declared ? (d.promo ? INK : STONE) : GOLD)
    }]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>'$'+(v/1000)+'k'}}}}
  });
  charts.weeklyChart = new Chart(document.getElementById('weeklyChart'), {
    type:'bar',
    data:{labels:D.weekly_trend.map(w=>'Week '+w.week), datasets:[{label:'Net Sales', data:D.weekly_trend.map(w=>w.net_sales), backgroundColor:GOLD, borderRadius:3}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>'$'+(v/1000)+'k'}}}}
  });
  const maxDow = Math.max(...D.day_of_week.map(d=>d.net_sales));
  charts.dowChart = new Chart(document.getElementById('dowChart'), {
    type:'bar',
    data:{labels:D.day_of_week.map(d=>d.day.slice(0,3)), datasets:[{data:D.day_of_week.map(d=>d.net_sales), backgroundColor:D.day_of_week.map(d=>d.net_sales===maxDow?GOLD:STONE), borderRadius:3}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>'$'+(v/1000)+'k'}}}}
  });
  charts.mixChart = new Chart(document.getElementById('mixChart'), {
    type:'doughnut',
    data:{labels:D.product_type_mix.map(t=>t.type), datasets:[{data:D.product_type_mix.map(t=>t.net_sales), backgroundColor:palette, borderWidth:2, borderColor:'#fff'}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}
  });
  document.getElementById('mixLegend').innerHTML = D.product_type_mix.map((t,i)=>
    `<div class="legend-item"><span class="legend-dot" style="background:${palette[i]}"></span>${t.type} — ${fmt$(t.net_sales)} (${fmtN(t.units)} units)</div>`).join('');
}

function setProductMode(mode){
  productMode = mode;

  buildProductChart();
}
function buildProductChart(){
  killChart('prodChart');
  const src = productMode==='sales' ? D.top_products_sales : D.top_products_units;
  const val = p => productMode==='sales' ? p.net_sales : p.units;
  charts.prodChart = new Chart(document.getElementById('prodChart'), {
    type:'bar',
    data:{labels:src.map(p=>p.product), datasets:[{data:src.map(val), backgroundColor:GOLD, borderRadius:3}]},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{callback:v=> productMode==='sales' ? '$'+(v/1000)+'k' : v}}}}
  });
}
function buildAgeButtons(){
  const ages = Object.keys(D.top_products_by_age);
  document.getElementById('ageBtns').innerHTML = ages.map((a,i)=>`<button class="sel-btn ${i===0?'active':''}" onclick="showAgeDrill('${a}', this)">${a}</button>`).join('');
  showAgeDrill(ages[0]);
}
function showAgeDrill(age, btn){
  if(btn){ document.querySelectorAll('#ageBtns .sel-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  const items = D.top_products_by_age[age];
  const max = Math.max(...items.map(i=>i.units));
  document.getElementById('ageDrill').innerHTML = items.map(i=>`
    <div class="bar-row"><div class="label">${i.product}</div><div class="bar-track"><div class="bar-fill" style="width:${(i.units/max*100).toFixed(0)}%"></div></div><div class="bar-val">${i.units} units</div></div>`).join('');
}
function buildRegionButtons(){
  const regions = Object.keys(D.top_products_by_region);
  document.getElementById('regionBtns').innerHTML = regions.map((r,i)=>`<button class="sel-btn ${i===0?'active':''}" onclick="showRegionDrill('${r}', this)">${r}</button>`).join('');
  showRegionDrill(regions[0]);
}
function showRegionDrill(region, btn){
  if(btn){ document.querySelectorAll('#regionBtns .sel-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  const items = D.top_products_by_region[region];
  const max = Math.max(...items.map(i=>i.units));
  document.getElementById('regionDrill').innerHTML = items.map(i=>`
    <div class="bar-row"><div class="label">${i.product}</div><div class="bar-track"><div class="bar-fill" style="width:${(i.units/max*100).toFixed(0)}%"></div></div><div class="bar-val">${i.units} units</div></div>`).join('');
}

// ============ GEOGRAPHY ============
function renderGeography(){
  const el = document.getElementById('geography');
  const max = Math.max(...D.geography.map(g=>g.net_sales));
  el.innerHTML = `
    <div class="section-label">Tab 5</div>
    <div class="section-title">Geography</div>
    <div class="card">
      <div class="card-title">Top 15 States by Net Sales</div>
      ${D.geography.map(g=>`<div class="bar-row"><div class="label">${g.state}</div><div class="bar-track"><div class="bar-fill" style="width:${(g.net_sales/max*100).toFixed(0)}%"></div></div><div class="bar-val">${fmt$(g.net_sales)}</div></div>`).join('')}
    </div>
    <div class="card">
      <div class="card-title">Top Products by State</div>
      <div id="stateBtns"></div>
      <div class="drill-list" id="stateDrill"></div>
    </div>
  `;
  const states = Object.keys(D.top_products_by_state);
  document.getElementById('stateBtns').innerHTML = states.map((s,i)=>`<button class="sel-btn ${i===0?'active':''}" onclick="showStateDrill('${s}', this)">${s}</button>`).join('');
  showStateDrill(states[0]);
}
function showStateDrill(state, btn){
  if(btn){ document.querySelectorAll('#stateBtns .sel-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  const items = D.top_products_by_state[state];
  const max = Math.max(...items.map(i=>i.units));
  document.getElementById('stateDrill').innerHTML = items.map(i=>`
    <div class="bar-row"><div class="label">${i.product}</div><div class="bar-track"><div class="bar-fill" style="width:${(i.units/max*100).toFixed(0)}%"></div></div><div class="bar-val">${i.units} units</div></div>`).join('');
}

// ============ TIMING ============
function renderTiming(){
  const el = document.getElementById('timing');
  const peak = D.peak_hour;
  const peakLabel = peak===0?'12am':peak<12?peak+'am':peak===12?'12pm':(peak-12)+'pm';
  el.innerHTML = `
    <div class="section-label">Tab 6</div>
    <div class="section-title">Purchase Timing</div>
    <div class="card">
      <div class="card-title">24-Hour Sales Heatmap (units sold)</div>
      <div id="heatmap" style="display:grid; grid-template-columns:repeat(24,1fr); gap:3px;"></div>
    </div>
    <div class="insight">Peak purchasing hour was <b>${peakLabel}</b>. Sales activity is concentrated in the afternoon/evening hours, consistent with a national customer base checking out after work.</div>
    <div class="grid-2">
      <div class="card"><div class="card-title">Hourly by Region</div><div id="regionHourBtns"></div><div class="chart-wrap"><canvas id="regionHourChart"></canvas></div></div>
      <div class="card"><div class="card-title">Hourly by Age Group</div><div id="ageHourBtns"></div><div class="chart-wrap"><canvas id="ageHourChart"></canvas></div></div>
    </div>
    <div class="insight">Purchase timing patterns this month look more <b>geographic than age-driven</b>: regional hourly curves show clearer separation (West Coast customers buying later in the day) than the age-group curves, which largely track the same overall daily rhythm regardless of age.</div>
  `;
  const maxU = Math.max(...D.hourly_all.map(h=>h.units));
  document.getElementById('heatmap').innerHTML = D.hourly_all.map(h=>{
    const intensity = maxU ? h.units/maxU : 0;
    const bg = `rgba(201,168,76,${0.15+intensity*0.85})`;
    return `<div title="${h.hour}:00 — ${h.units} units, ${fmt$(h.net_sales)}" style="background:${bg}; border-radius:3px; padding:8px 2px; text-align:center; font-family:'DM Mono',monospace; font-size:10px; color:${intensity>0.5?'#fff':'#3D3328'};">${h.hour}</div>`;
  }).join('');

  const regions = Object.keys(D.hourly_by_region);
  document.getElementById('regionHourBtns').innerHTML = regions.map((r,i)=>`<button class="sel-btn ${i===0?'active':''}" onclick="showRegionHour('${r}', this)">${r}</button>`).join('');
  showRegionHour(regions[0]);

  const ages = Object.keys(D.hourly_by_age);
  document.getElementById('ageHourBtns').innerHTML = ages.map((a,i)=>`<button class="sel-btn ${i===0?'active':''}" onclick="showAgeHour('${a}', this)">${a}</button>`).join('');
  showAgeHour(ages[0]);
}
function showRegionHour(region, btn){
  if(btn){ document.querySelectorAll('#regionHourBtns .sel-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  killChart('regionHourChart');
  const items = D.hourly_by_region[region];
  charts.regionHourChart = new Chart(document.getElementById('regionHourChart'), {
    type:'bar', data:{labels:items.map(i=>i.hour), datasets:[{data:items.map(i=>i.units), backgroundColor:GOLD, borderRadius:2}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}
  });
}
function showAgeHour(age, btn){
  if(btn){ document.querySelectorAll('#ageHourBtns .sel-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  killChart('ageHourChart');
  const items = D.hourly_by_age[age];
  charts.ageHourChart = new Chart(document.getElementById('ageHourChart'), {
    type:'bar', data:{labels:items.map(i=>i.hour), datasets:[{data:items.map(i=>i.units), backgroundColor:TEAL, borderRadius:2}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}
  });
}

// ============ RETURNS ============
function renderReturns(){
  const el = document.getElementById('returns');
  const rs = D.returns_summary;
  const topReturn = D.qty_groups.reduce((a,b)=>a.return_rate>b.return_rate?a:b);
  el.innerHTML = `
    <div class="section-label">Tab 7</div>
    <div class="section-title">Returns</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-value">${fmtN(rs.total_return_rows)}</div><div class="kpi-label">Total Return Rows</div></div>
      <div class="kpi-card"><div class="kpi-value">${fmtN(rs.customers_with_returns)}</div><div class="kpi-label">Customers with Returns</div></div>
      <div class="kpi-card"><div class="kpi-value">${fmt$(rs.total_return_value)}</div><div class="kpi-label">Total Return Value</div></div>
      <div class="kpi-card"><div class="kpi-value">${fmtPct(rs.return_rate_pct)}</div><div class="kpi-label">Return Rate</div></div>
    </div>
    <div class="card">
      <div class="card-title">Return Rate by Quantity Group</div>
      ${D.qty_groups.map(g=>`<div class="bar-row"><div class="label">${g.group}</div><div class="bar-track"><div class="bar-fill rose" style="width:${(g.return_rate/topReturn.return_rate*100).toFixed(0)}%"></div></div><div class="bar-val">${g.return_rate}% (${g.order_count} orders)</div></div>`).join('')}
    </div>
    <div class="insight">Return rates are fairly consistent across basket sizes (5&ndash;9%), with the <b>${topReturn.group}</b> group showing the highest rate at ${topReturn.return_rate}%, though that group is a small sample (${topReturn.order_count} orders).</div>
    <div class="card"><div class="card-title">Return Value by Quantity Group</div><div class="chart-wrap"><canvas id="retValChart"></canvas></div></div>
    <div class="card">
      <div class="card-title">Top 10 Returned Products</div>
      <table><thead><tr><th>Rank</th><th>Product</th><th>Return Value</th><th>Occurrences</th><th>Gross Sales</th><th>Return Rate</th></tr></thead>
      <tbody>${D.top_returned_products.map((p,i)=>`<tr class="${p.return_rate_pct>20?'hot':''}"><td>${i+1}</td><td>${p.product}</td><td>${fmt$(p.return_value)}</td><td>${p.occurrences}</td><td>${fmt$(p.gross_sales)}</td><td>${p.return_rate_pct}%</td></tr>`).join('')}</tbody></table>
    </div>
  `;
  charts.retValChart = new Chart(document.getElementById('retValChart'), {
    type:'bar', data:{labels:D.qty_groups.map(g=>g.group), datasets:[{data:D.qty_groups.map(g=>g.return_value), backgroundColor:ROSE, borderRadius:3}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>'$'+v}}}}
  });
}

// ============ SURVEY ============
function renderSurvey(){
  const el = document.getElementById('survey');
  const core = D.age_distribution.filter(a=>['50-59','60-69','70-79'].includes(a.age_group)).reduce((s,a)=>s+a.count,0);
  const totalAge = D.age_distribution.reduce((s,a)=>s+a.count,0);
  const topTrend = D.trend_requests[0];
  el.innerHTML = `
    <div class="section-label">Tab 8</div>
    <div class="section-title">Survey</div>
    <div class="card"><div class="card-title">Age Distribution</div><div class="chart-wrap"><canvas id="ageDistChart"></canvas></div></div>
    <div class="insight">The core 50&ndash;79 cohort represents <b>${(core/totalAge*100).toFixed(0)}%</b> of survey respondents this month, confirming the customer base skews toward established, older buyers rather than younger first-time shoppers.</div>
    <div class="section-title" style="font-size:24px; margin-top:32px;">Trend Requests</div>
    <div class="grid-3" id="trendCards"></div>
    <div class="insight">The most-requested category this month was <b>${topTrend.category}</b> (${topTrend.count} mentions). Comparing this against the Products tab shows where customer requests and current sales mix may not be aligned &mdash; worth a look at whether top-requested categories are proportionally represented in the product lineup and marketing push.</div>
  `;
  charts.ageDistChart = new Chart(document.getElementById('ageDistChart'), {
    type:'bar', data:{labels:D.age_distribution.map(a=>a.age_group), datasets:[{data:D.age_distribution.map(a=>a.count), backgroundColor:GOLD, borderRadius:3}]},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}
  });
  const maxTrend = Math.max(...D.trend_requests.map(t=>t.count));
  document.getElementById('trendCards').innerHTML = D.trend_requests.map(t=>`
    <div class="channel-card"><div class="name">${t.category}</div><div class="stats">${t.count} mentions</div><div class="mini-progress"><div class="fill" style="width:${(t.count/maxTrend*100).toFixed(0)}%"></div></div></div>`).join('');
}

const RENDERERS = {
  overview: renderOverview, customers: renderCustomers, channels: renderChannels,
  products: renderProducts, geography: renderGeography, timing: renderTiming,
  returns: renderReturns, survey: renderSurvey
};

document.getElementById('container').innerHTML = TABS.map((t,i)=>`<div class="tab-content ${i===0?'active':''}" id="${t.id}"></div>`).join('');
renderTab('overview');
</script>
</body>
